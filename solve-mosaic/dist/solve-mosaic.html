<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solve Mosaic</title>
  <meta name="description" content="The Solve wordmark imagined as a Roman floor mosaic: about eight thousand procedurally laid 3D tesserae, built stone by stone in the browser." />
  <style>
    :root {
      --bg-0: #0d0c0b;
      --bg-1: #2a2622;
      --bar: #141210;
      --line: #2b2723;
      --text: #ddd5c7;
      --muted: #9a9081;
      --accent: #2db6ba;
      --btn: #1d1a17;
      --btn-hover: #27231f;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-0: #cfc8bc;
        --bg-1: #f1ece3;
        --bar: #ebe5da;
        --line: #d6cec0;
        --text: #2a2622;
        --muted: #6f665a;
        --btn: #f6f2ea;
        --btn-hover: #fffdf8;
      }
    }
    :root[data-theme="dark"] {
      --bg-0: #0d0c0b;
      --bg-1: #2a2622;
      --bar: #141210;
      --line: #2b2723;
      --text: #ddd5c7;
      --muted: #9a9081;
      --btn: #1d1a17;
      --btn-hover: #27231f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bar);
      color: var(--text);
      font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* the artwork's own studio setting stays dark in both themes */
    #stage {
      position: fixed; left: 0; right: 0; top: 0; bottom: 56px;
      background: #14110e;
      touch-action: none;
    }
    #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #9a9081; letter-spacing: 0.04em; font-size: 13px;
      transition: opacity 0.6s ease; pointer-events: none;
    }
    #loading.done { opacity: 0; }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; min-height: 56px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      padding: 8px 16px 10px; background: var(--bar); border-top: 1px solid var(--line);
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    button, select {
      font: inherit; color: var(--text); background: var(--btn);
      border: 1px solid var(--line); border-radius: 7px; height: 32px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    }
    button:hover, select:hover { background: var(--btn-hover); }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button svg { width: 15px; height: 15px; flex: none; }
    label.speed { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .status { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; min-width: 0; }
    .status .sep { opacity: 0.5; }
    #phase { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track { position: absolute; left: 0; right: 0; top: -1px; height: 2px; overflow: hidden; }
    #progress { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: 0.85; }
    .hint { color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      .status { margin-left: 0; width: 100%; }
      .hint { display: none; }
      button span.lbl-wide, .speed .lbl-text { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage" role="img" aria-label="The Solve wordmark as a Roman floor mosaic of stone tesserae, with paper planes and a meander border"><div id="loading">Laying out the tesserae…</div></div>
  <div id="bar" role="toolbar" aria-label="Mosaic controls">
    <div class="track"><div id="progress"></div></div>
    <div class="controls">
      <button id="replay" title="Replay the construction (R)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>
        <span>Replay</span>
      </button>
      <button id="pause" title="Pause or resume (Space)" aria-pressed="false">
        <svg class="ico-pause" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="0.8"/><rect x="9.5" y="2.5" width="3" height="11" rx="0.8"/></svg>
        <svg class="ico-play" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M4 2.6v10.8a.6.6 0 0 0 .9.5l8.6-5.4a.6.6 0 0 0 0-1L4.9 2.1a.6.6 0 0 0-.9.5z"/></svg>
        <span>Pause</span>
      </button>
      <label class="speed" title="Construction speed"><span class="lbl-text">Speed</span>
        <select id="speed" aria-label="Construction speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="speed" title="Camera (C)"><span class="lbl-text">Camera</span>
        <select id="cam" aria-label="Camera mode">
          <option value="cinematic" selected>Cinematic</option>
          <option value="overview">Overview</option>
        </select>
      </label>
      <button id="finish" title="Show the completed mosaic (F)">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 2.8v10.4a.5.5 0 0 0 .8.4L10 8.4a.5.5 0 0 0 0-.8L3.3 2.4a.5.5 0 0 0-.8.4z"/><rect x="11" y="2.5" width="2.5" height="11" rx="0.7"/></svg>
        <span>Completed<span class="lbl-wide"> mosaic</span></span>
      </button>
      <button id="view" title="Return to the full view (V)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3.5" width="12" height="9" rx="1"/><path d="M8 1v2M8 13v2M0.8 8h1.2M14 8h1.2"/></svg>
        <span>Full view</span>
      </button>
    </div>
    <div class="status" aria-live="polite">
      <span id="phase">Preparing</span><span class="sep">·</span><span id="count">…</span>
      <span class="hint">· drag to orbit, right-drag to pan, scroll to zoom</span>
    </div>
  </div>
